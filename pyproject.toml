[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrum-gse"
version = "1.0.0"
description = "Deterministic validation and analysis engine"
authors = [
  { name = "Spectrum GSE", email = "contact@spectrumgse.example" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE.md" }

dependencies = [
  "qiskit>=1.0.0",
  "qiskit-aer>=0.13.3",
  "qiskit-ibm-runtime>=0.22.0",
  "numpy>=1.23",
]

[project.scripts]
spectrum-gse = "spectrum_gse.engine:cli_main"
